services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      - ML_BACKEND=http://ml:8001
    depends_on:
      - ml
    restart: unless-stopped

  ml:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ml
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - hf-cache:/cache
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  hf-cache:
  caddy-data:
  caddy-config:
